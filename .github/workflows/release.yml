name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes from commits
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found; using all commits."
            git log --no-merges --pretty=format:"- %s (%h)" > /tmp/notes.md
          else
            git log --no-merges --pretty=format:"- %s (%h)" "${PREV_TAG}..${TAG}" > /tmp/notes.md
          fi

          echo "=== Release notes ==="
          cat /tmp/notes.md

      - name: Create GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file /tmp/notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
