name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  validate-hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Hassfest validation
        run: |
          for attempt in 1 2 3; do
            echo "Running hassfest (attempt ${attempt}/3)…"
            if docker run --rm -v $GITHUB_WORKSPACE://github/workspace ghcr.io/home-assistant/hassfest; then
              exit 0
            fi
            echo "::warning::hassfest failed, retrying in 20s…"
            sleep 20
          done
          exit 1